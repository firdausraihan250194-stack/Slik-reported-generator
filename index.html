<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLIK Report Generator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- SheetJS Library untuk Membaca & Membuat File Excel -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 40%, #0f172a 100%);
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4 md:p-8 relative overflow-hidden">

  <!-- Glow Background Effects -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-blue-600/20 rounded-full blur-[120px] pointer-events-none"></div>
  <div class="absolute bottom-10 right-10 w-[300px] h-[300px] bg-indigo-600/15 rounded-full blur-[100px] pointer-events-none"></div>

  <!-- Main Card Container -->
  <main class="w-full max-w-3xl bg-slate-900/80 backdrop-blur-xl rounded-2xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] border border-slate-700/60 overflow-hidden relative z-10">
    
    <!-- Header Section -->
    <header class="bg-gradient-to-r from-blue-900/40 via-indigo-900/40 to-slate-900/40 p-6 md:p-8 border-b border-slate-700/50 flex items-center gap-4">
      <div class="p-3.5 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-xl text-white shadow-lg shadow-blue-500/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
      </div>
      <div>
        <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-100 to-slate-300">
          SLIK Report Generator
        </h1>
        <p class="text-sm md:text-base text-slate-300 mt-1 font-medium">
          Automated SLIK Processing, 5-Year Payment Projection & Summary
        </p>
      </div>
    </header>

    <!-- Form Content -->
    <div class="p-6 md:p-8 space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Input Nama File Output -->
        <div>
          <label class="block text-xs font-bold tracking-wider text-slate-400 uppercase mb-2">Nama File Output</label>
          <div class="relative flex items-center">
            <input 
              id="outputFileName"
              type="text" 
              value="Generated SLIK" 
              class="w-full bg-slate-950/70 border border-slate-700/80 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-all pr-16 shadow-inner"
            />
            <span class="absolute right-4 text-sm text-slate-400 font-mono font-semibold">.xlsx</span>
          </div>
        </div>

        <!-- Upload File Mentah -->
        <div>
          <label class="block text-xs font-bold tracking-wider text-slate-400 uppercase mb-2">Unggah File Mentah SLIK</label>
          <div class="flex items-center bg-slate-950/70 border border-slate-700/80 rounded-xl overflow-hidden p-1 shadow-inner">
            <label class="cursor-pointer bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white text-sm font-semibold px-4 py-2.5 rounded-lg transition-all shrink-0 shadow-md">
              Choose File
              <input id="fileInput" type="file" accept=".xlsx, .xls, .csv" class="hidden" />
            </label>
            <span id="fileNameDisplay" class="text-sm text-slate-400 px-3 truncate font-medium">No file chosen</span>
          </div>
        </div>

      </div>

      <!-- Submit Button -->
      <button 
        id="processBtn"
        type="button" 
        class="w-full mt-4 bg-gradient-to-r from-blue-600 via-indigo-600 to-blue-600 hover:opacity-95 text-white font-semibold py-3.5 px-6 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 shadow-lg shadow-indigo-600/30">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        Proses & Buat Link Download
      </button>

      <!-- Status Notifikasi -->
      <div id="statusMessage" class="hidden text-center text-sm font-medium p-3 rounded-xl border"></div>
    </div>

  </main>

  <!-- Skrip Pemrosesan Data SLIK -->
  <script>
    const fileInput = document.getElementById('fileInput');
    const fileNameDisplay = document.getElementById('fileNameDisplay');
    const processBtn = document.getElementById('processBtn');
    const outputFileName = document.getElementById('outputFileName');
    const statusMessage = document.getElementById('statusMessage');

    let uploadedRawData = null;

    // 1. Deteksi saat file dipilih
    fileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        fileNameDisplay.textContent = file.name;
        fileNameDisplay.classList.replace('text-slate-400', 'text-slate-200');

        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            
            // Mengambil sheet pertama
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            // Konversi sheet ke data JSON
            uploadedRawData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
            
            showStatus('File mentah SLIK berhasil dimuat! Siap diproses.', 'success');
          } catch (err) {
            console.error(err);
            showStatus('Gagal membaca file Excel. Pastikan format file valid.', 'error');
          }
        };
        reader.readAsArrayBuffer(file);
      } else {
        fileNameDisplay.textContent = 'No file chosen';
        uploadedRawData = null;
      }
    });

    // 2. Pemrosesan Data & Generate File Excel Baru
    processBtn.addEventListener('click', () => {
      if (!uploadedRawData || uploadedRawData.length === 0) {
        showStatus('Harap pilih file mentah SLIK terlebih dahulu!', 'warning');
        return;
      }

      showStatus('Sedang memproses data SLIK...', 'info');

      setTimeout(() => {
        try {
          // Buat Workbook & Sheet baru
          const newWorkbook = XLSX.utils.book_new();

          /* 
            Catatan: Di bawah ini adalah struktur dasar tabel output SLIK. 
            Kamu bisa meletakkan logika transformasi data/proyeksi 5 tahun kamu di sini.
          */
          let processedData = [];

          // Menggunakan data mentah yang ada atau menyusun header default jika diperlukan
          if (uploadedRawData.length > 0) {
            processedData = uploadedRawData;
          } else {
            processedData = [
              ["No", "Nama Fasilitas", "Plafon", "Baki Debet", "Kualitas", "Proyeksi Angsuran"],
              [1, "Kredit Pemilikan Rumah (KPR)", 500000000, 450000000, "1 - Lancar", 4500000]
            ];
          }

          const newWorksheet = XLSX.utils.aoa_to_sheet(processedData);
          XLSX.utils.book_append_sheet(newWorkbook, newWorksheet, "SLIK Summary");

          // Nama File Output
          let fileName = outputFileName.value.trim() || 'Generated SLIK';
          if (!fileName.endsWith('.xlsx')) {
            fileName += '.xlsx';
          }

          // Unduh File
          XLSX.writeFile(newWorkbook, fileName);
          showStatus('File SLIK berhasil diproses dan diunduh!', 'success');

        } catch (error) {
          console.error(error);
          showStatus('Terjadi kesalahan saat memproses data.', 'error');
        }
      }, 500);
    });

    // Fungsi Pembantu Tampilan Status Notifikasi
    function showStatus(message, type) {
      statusMessage.textContent = message;
      statusMessage.classList.remove('hidden', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400', 
                                    'bg-amber-500/10', 'border-amber-500/30', 'text-amber-400', 
                                    'bg-rose-500/10', 'border-rose-500/30', 'text-rose-400',
                                    'bg-blue-500/10', 'border-blue-500/30', 'text-blue-400');

      if (type === 'success') {
        statusMessage.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-400');
      } else if (type === 'warning') {
        statusMessage.classList.add('bg-amber-500/10', 'border-amber-500/30', 'text-amber-400');
      } else if (type === 'error') {
        statusMessage.classList.add('bg-rose-500/10', 'border-rose-500/30', 'text-rose-400');
      } else {
        statusMessage.classList.add('bg-blue-500/10', 'border-blue-500/30', 'text-blue-400');
      }
    }
  </script>

</body>
</html>
