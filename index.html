<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SLIK Report Generator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      /* Sesuaikan nama file gambar jika ada ekstensi lain */
      background-image: url('Gambar_4K_Jernih.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      position: relative;
    }
    /* Overlay sangat tipis agar gambar terlihat jelas secara keseluruhan */
    body::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.15); 
      z-index: -1;
    }
    /* Bayangan teks agar tulisan tetap kontras dan terbaca jelas */
    .text-readable {
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-4 md:p-8">

  <!-- Main Card Container (Glassmorphism Transparan) -->
  <main class="w-full max-w-3xl bg-slate-900/40 backdrop-blur-md rounded-2xl shadow-2xl border border-white/20 overflow-hidden relative z-10">
    
    <!-- Header Section -->
    <header class="bg-blue-900/40 p-6 md:p-8 border-b border-white/10 flex items-center gap-4">
      <div class="p-3 bg-blue-600/50 backdrop-blur-sm rounded-xl text-blue-200 shadow-lg">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
        </svg>
      </div>
      <div>
        <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight text-readable">SLIK Report Generator</h1>
        <p class="text-sm md:text-base text-slate-200 mt-1 font-medium text-readable">Automated SLIK Processing, 5-Year Payment Projection & Summary</p>
      </div>
    </header>

    <!-- Form Content -->
    <div class="p-6 md:p-8 space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        
        <!-- Input Nama File Output -->
        <div>
          <label class="block text-xs font-bold tracking-wider text-slate-200 uppercase mb-2 text-readable">Nama File Output</label>
          <div class="relative flex items-center">
            <input 
              type="text" 
              value="Generated SLIK" 
              class="w-full bg-slate-950/60 backdrop-blur-sm border border-white/20 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-blue-400 transition-colors pr-16 shadow-inner"
            />
            <span class="absolute right-4 text-sm text-slate-300 font-mono font-semibold">.xlsx</span>
          </div>
        </div>

        <!-- Upload File Mentah -->
        <div>
          <label class="block text-xs font-bold tracking-wider text-slate-200 uppercase mb-2 text-readable">Unggah File Mentah SLIK</label>
          <div class="flex items-center bg-slate-950/60 backdrop-blur-sm border border-white/20 rounded-lg overflow-hidden p-1 shadow-inner">
            <label class="cursor-pointer bg-blue-600 hover:bg-blue-500 text-white text-sm font-semibold px-4 py-2 rounded-md transition-colors shrink-0 shadow-md">
              Choose File
              <input type="file" class="hidden" />
            </label>
            <span class="text-sm text-slate-300 px-3 truncate font-medium">No file chosen</span>
          </div>
        </div>

      </div>

      <!-- Submit Button -->
      <button 
        type="button" 
        class="w-full mt-4 bg-blue-600/90 hover:bg-blue-500 text-white font-semibold py-3.5 px-6 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 shadow-lg shadow-blue-900/50 backdrop-blur-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        Proses & Buat Link Download
      </button>
    </div>

  </main>

</body>
</html>
